name: Deploy THARESYS to Google Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'engine/**'
      - '.github/workflows/deploy-engine.yml'
  workflow_dispatch:

env:
  PROJECT_ID: thrail
  SERVICE_NAME: tars-recommendation-engine
  REGION: asia-southeast1

jobs:
  deploy:
    name: Build & Deploy Engine
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY || secrets.FIREBASE_SERVICE_ACCOUNT_THRAIL }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --source ./engine \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --allow-unauthenticated \
            --memory 1Gi \
            --cpu 1 \
            --timeout 300 \
            --set-env-vars PROJECT_ID="${{ env.PROJECT_ID }}",GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}",THARESYS_API_KEY="${{ secrets.THARESYS_API_KEY }}"

      - name: Display Deployed Service URL
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} --region ${{ env.REGION }} --project ${{ env.PROJECT_ID }} --format 'value(status.url)')
          echo "=========================================================="
          echo "THARESYS Engine deployed successfully!"
          echo "URL: $URL"
          echo "=========================================================="
